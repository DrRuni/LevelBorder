mob-spawning:
  enabled: true
  # Aktiviert oder deaktiviert das zusätzliche Monster-Spawning vom Plugin.

  debug:
    vanilla-spawns: false
    # Zeigt natürliche Vanilla-Spawns in dunkelrot in der Konsole.

    plugin-spawns: false
    # Zeigt Plugin-Spawns in der Konsole.
    # Grün = innerhalb der Border
    # Pink = außerhalb der Border

    failed-attempts: false
    # Zeigt fehlgeschlagene Spawn-Versuche.
    # Nur zum Debuggen aktivieren, sonst spammt die Konsole.

  assist-inside-until-border-size: 31.0
  # Bis zu dieser Bordergröße darf das Plugin innerhalb der Border helfen.

  interval-ticks: 40
  # Wie oft das Plugin einen Spawn-Versuch startet.

  distance:
    min-to-player: 28
    # Mindestabstand zum Spieler.

    max-to-player: 96
    # Maximaler Abstand zum Spieler.

  vertical-search:
    surface-chance: 0.70
    # Chance für Oberflächen-Spawns innerhalb der Border.
    # 0.70 = 70% Oberfläche, 30% Untergrund.

    underground-search-down: 12
    # Wie viele Blöcke nach unten gesucht wird,

    pack-search-down: 4
    # Wie weit bei Gruppen-Spawns nach einem passenden Boden gesucht wird.

  small-border:
    inside-candidate-chance: 0.70
    # Bei kleiner Border: Wie stark das Plugin innerhalb der Border sucht.
    # 0.70 = 70% der Kandidaten werden innen gesucht.

  amount:
    global-multiplier: 1.0
    # Allgemeiner Mengen-Faktor.
    # 1.0 = normal, 0.5 = weniger, 2.0 = mehr.

    inside-border-multiplier: 1.0
    # Mengen-Faktor für Spawns innerhalb der Border.

    outside-border-multiplier: 1.0
    # Mengen-Faktor für Spawns außerhalb der Border.

  caps:
    per-player: 24
    # Maximal so viele Plugin-Monster im Spielerbereich.

    per-world: 80
    # Maximal so viele Plugin-Monster in der ganzen Welt.

    per-chunk: 6
    # Maximal so viele Plugin-Monster pro Chunk.

  attempts:
    rounds-per-check: 1
    # Wie viele Spawn-Runden pro Intervall laufen.

    candidate-positions: 8
    # Wie viele mögliche Positionen pro Runde geprüft werden.

  mobs:
    zombie:
      enabled: true
      weight: 100
      max-pack-size: 3
      # Normale Zombies. Häufig, können in kleinen Gruppen spawnen.

    zombie-villager:
      enabled: true
      weight: 1
      max-pack-size: 1
      # Zombie-Dorfbewohner. Selten und immer einzeln.

    skeleton:
      enabled: true
      weight: 100
      max-pack-size: 2
      # Skelette. Häufig, aber hier maximal zu zweit.

    spider:
      enabled: true
      weight: 100
      max-pack-size: 2
      # Spinnen. Häufig, brauchen genug Platz.

    creeper:
      enabled: true
      weight: 75
      max-pack-size: 1
      # Creeper. Etwas seltener und nur einzeln.

    enderman:
      enabled: true
      weight: 10
      max-pack-size: 1
      # Endermen. Sehr selten und nur einzeln.

    witch:
      enabled: true
      weight: 1
      max-pack-size: 1
      # Hexen. Sehr selten und nur einzeln.